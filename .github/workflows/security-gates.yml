name: "Security Gate"
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Analyze terraform code with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          output_format: cli, sarif
          output_file_path: console, results.sarif
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif
  tfsec:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Echo
        run: echo "tfsec!"   
  opa:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Echo
        run: echo "opa!"   
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Echo
        run: echo "trivy!"   
  prowler:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Echo
        run: echo "Prowler!"